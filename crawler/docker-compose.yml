services:
  details:
    build: .
    environment:
      - STEAM_API_KEY=${STEAM_API_KEY}
    volumes:
      - steamdata:/data
    # applist (ilk sefer) + details; bitince durur
    command: sh -c "python steam_crawl.py --stage applist && python steam_crawl.py --stage details"
    restart: unless-stopped

  reviews:
    build: .
    volumes:
      - steamdata:/data
    # details'ın 'game' olarak işaretlediklerini sürekli tarar, yeni yoksa 10 dk bekler
    command: sh -c "sleep 300; while true; do python steam_crawl.py --stage reviews; sleep 600; done"
    restart: unless-stopped

  spy:
    build: .
    volumes:
      - steamdata:/data
    command: sh -c "sleep 300; while true; do python steam_crawl.py --stage spy; sleep 600; done"
    restart: unless-stopped

volumes:
  steamdata:
