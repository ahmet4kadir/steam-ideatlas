services:
  # 1) veri çekme (bitti; tekrar koşturursan sadece eksikleri tamamlar)
  details:
    build: .
    environment:
      - STEAM_API_KEY=${STEAM_API_KEY}
    volumes:
      - steamdata:/data
    command: sh -c "python steam_crawl.py --stage applist && python steam_crawl.py --stage details"
    restart: "no"

  spy:
    build: .
    volumes:
      - steamdata:/data
    command: sh -c "python steam_crawl.py --stage spy"
    restart: "no"

  # 2) embedding + harita + kümeler + boşluklar -> /data/web  (tek seferlik, ~2-4 saat CPU)
  pipeline:
    build: ../pipeline
    environment:
      - EMBED_BACKEND=${EMBED_BACKEND:-local}
      - EMBED_MODEL=${EMBED_MODEL:-BAAI/bge-small-en-v1.5}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - steamdata:/data
    restart: "no"

  # 3) fikir API'si: Claude + embedding geri besleme döngüsü, galeri  (/api/*)
  api:
    build: ../api
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      - EMBED_MODEL=${EMBED_MODEL:-BAAI/bge-small-en-v1.5}
      - MAX_DRAFTS=${MAX_DRAFTS:-3}
      - PER_IP_PER_HOUR=${PER_IP_PER_HOUR:-6}
      - DAILY_CAP=${DAILY_CAP:-300}
    volumes:
      - steamdata:/data
    expose:
      - "8000"
    restart: unless-stopped

  # 4) site: three.js viewer + /data/web dosyaları + /api proxy  -> bu servise domain ver
  web:
    build: ../web
    depends_on:
      - api
    expose:
      - "80"
    volumes:
      - steamdata:/data:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  steamdata:
