server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    gzip on; gzip_types application/json application/javascript text/css application/octet-stream; gzip_min_length 1024;

    location /data/ {
        alias /data/web/;
        add_header Cache-Control "public, max-age=3600";
        types { application/octet-stream bin; application/json json; }
    }
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_buffering off; proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
    }
    location /vendor/ { add_header Cache-Control "public, max-age=604800"; }
    location / { try_files $uri $uri/ /index.html; }
}
